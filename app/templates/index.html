{% extends "base.html" %}
{% block content %}
<div class="brand">
  <span class="brand-icon">🧾</span>
  <h1>Receipt Scanner</h1>
  <p class="subtitle">Upload a receipt photo and get structured, exportable line items.</p>
</div>

<form action="/upload" method="post" enctype="multipart/form-data" class="upload-form">
  <label for="file" class="dropzone">
    <input type="file" id="file" name="file" accept="image/jpeg,image/png,image/gif,image/webp" required>
    <span class="dropzone-icon">📷</span>
    <span class="dropzone-text">Click to choose a receipt photo</span>
    <span class="dropzone-hint">JPEG, PNG, GIF or WEBP</span>
  </label>
  <button type="submit" class="btn btn-primary btn-block">Extract Items</button>
</form>
{% endblock %}
